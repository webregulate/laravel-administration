name: Update docs/versions.json

on:
  push:
    branches: [main]
    paths:
      - 'src/Classes/VersionHandler/Versions/**.php'

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Find latest VersionUpdate version
        id: version
        run: |
          LATEST=""
          for file in src/Classes/VersionHandler/Versions/Version_*.php; do
            [ -f "$file" ] || continue
            base=$(basename "$file" .php)
            ver=$(echo "$base" | sed 's/^Version_//' | tr '_' '.')
            if [ -z "$LATEST" ] || [ "$(php -r "echo version_compare('$ver', '$LATEST', '>') ? 'yes' : 'no';")" = "yes" ]; then
              LATEST="$ver"
            fi
          done
          if [ -z "$LATEST" ]; then
            echo "No Version_*.php files found" >&2
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Prepend version to docs/versions.json if not already listed
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          VERSION="${{ steps.version.outputs.version }}"
          php -r "
            \$file = 'docs/versions.json';
            \$entries = file_exists(\$file) ? json_decode(file_get_contents(\$file), true) : [];
            if (!is_array(\$entries)) \$entries = [];
            foreach (\$entries as \$e) {
              if (\$e['version'] === '$VERSION') exit(0);
            }
            array_unshift(\$entries, ['version' => '$VERSION', 'date' => '$TODAY']);
            file_put_contents(\$file, json_encode(\$entries, JSON_PRETTY_PRINT) . PHP_EOL);
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/versions.json
          if git diff --staged --quiet; then
            echo "docs/versions.json already up to date, nothing to commit."
          else
            git commit -m "chore: add v${{ steps.version.outputs.version }} to docs/versions.json"
            git push
          fi
