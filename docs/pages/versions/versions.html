<h1 class="docs-title"><i class="fa-solid fa-tags mr-3 text-primary-500"></i>Version History</h1>
<p class="docs-lead">All WRLA releases, newest first. Click a version to view its breaking changes, features, and bug fixes.</p>

<div class="relative mb-4">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.65 4.65a7.5 7.5 0 0011.99 11.99z"/>
    </svg>
    <input
        type="text"
        id="version-search"
        placeholder="Search by version number, e.g. 0.8.1"
        class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-300"
    >
</div>

<div id="versions-list" class="space-y-3">
    <!-- Populated by documentation.js after load -->
    <div class="flex items-center gap-3 text-gray-400 py-8">
        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span class="text-sm">Loading versions&hellip;</span>
    </div>
</div>
<p id="version-search-empty" class="hidden text-gray-500 italic text-sm py-4">No versions match your search.</p>
